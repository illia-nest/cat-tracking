
[project]
name = "cat-tracking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics",
    "opencv-python",
    "pillow>=13.0.0",
    "imagehash>=4.3.2",
    "ipython>=9.18.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
